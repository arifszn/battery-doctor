<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Battery report</title>
<style>
:root {
  --bg: #eeecea; --field: #cdc3b6; --ink: #333231; --muted: #5e5a56; --soft: #e1ded9;
  --accent: #3f6b3a; --accent-ink: #ffffff; --warn: #8a4b12; --panel: #fbfaf8;
  --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --t1: clamp(30px, 2rem + .9vw, 46px); --t2: 18px; --t3: 15px;
  --pad: clamp(22px, 5vw, 72px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1a19; --field: #2b2926; --ink: #ecebe9; --muted: #b0aca6; --soft: #2a2927; --accent: #9fcb92; --accent-ink: #1b1a19; --warn: #e5b25c; --panel: #262523; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--t2)/1.6 var(--font); font-variant-numeric: tabular-nums; overflow-x: hidden; }
h1, h2, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
small, .small { font-size: var(--t3); }
.muted { color: var(--muted); }

.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
.stage { background: var(--field); min-width: 0; }
.stage-in { position: sticky; top: 0; height: 100svh; min-height: 560px; max-height: 960px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; }
.phone { height: min(calc(100svh - 110px), 760px); min-height: 480px; width: auto; max-width: 100%; display: block; overflow: visible; }
.phone-name { font-size: var(--t3); text-align: center; }
.read { padding: 0 var(--pad); min-width: 0; }
.read-in { max-width: 600px; }
.hero { padding: clamp(56px, 12svh, 120px) 0 0; }
h1 { font-weight: 500; font-size: var(--t1); line-height: 1.12; letter-spacing: -.02em; max-width: 14em; }
.line { margin-top: 28px; color: var(--muted); max-width: 30em; }
.notice { margin-top: 20px; color: var(--warn); }
.sec { margin-top: clamp(56px, 7vw, 96px); }
h2 { font-weight: 500; font-size: var(--t1); line-height: 1.12; letter-spacing: -.02em; }
.lead { margin-top: 16px; }

/* calendar */
.tl { margin-top: 28px; position: relative; }
.tr { margin-bottom: 32px; }
.tr svg { display: block; width: 100%; height: auto; overflow: visible; }
.tr text { font-family: var(--font); fill: var(--muted); font-size: 15px; }
.tr text.v { fill: var(--ink); font-size: 18px; font-weight: 600; }
.tr text.z { fill: var(--accent); }
.tr text.h { fill: var(--ink); font-weight: 600; }
.cal + .cal { margin-top: 28px; }
.cal-m { font-weight: 600; margin-bottom: 10px; }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-g .wd { font-size: 13px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.day { position: relative; width: 100%; min-height: 78px; padding: 6px 8px; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; line-height: 1.2; color: var(--muted); box-shadow: inset 0 0 0 1px var(--soft); }
.day.has { background: var(--soft); color: var(--ink); }
.day.ok { background: var(--accent); color: var(--accent-ink); }
.day.rough { background: none; box-shadow: none; outline: 1.5px dashed var(--muted); outline-offset: -2px; color: var(--ink); }
.day.cur { box-shadow: inset 0 0 0 3px var(--ink); }
.day .dv { font-size: 20px; font-weight: 600; }
.day .dv small { font-size: 13px; font-weight: 400; }
.day .di { font-size: 13px; }
.day .dm { position: absolute; top: 5px; right: 5px; font-size: 11px; font-weight: 600; line-height: 16px; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--bg); }
.day.ok .dm { background: var(--accent-ink); color: var(--accent); }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--bg); font-size: var(--t3); line-height: 1.35; padding: 12px 14px; border-radius: 8px; width: max-content; max-width: min(320px, 90vw); transform: translate(-50%, -100%); box-shadow: 0 8px 24px -8px rgba(0,0,0,.45); }
.tip .tt { font-weight: 600; font-size: 16px; }
.tip .tt span { font-weight: 400; opacity: .7; margin-left: 8px; }
.tip dl { margin-top: 8px; display: grid; grid-template-columns: auto auto; gap: 4px 20px; }
.tip dt { opacity: .7; white-space: nowrap; }
.tip dd { text-align: right; white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .tn { margin-top: 8px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--bg) 25%, transparent); font-size: 13px; opacity: .85; }
.tip .tn + .tn { margin-top: 2px; padding-top: 0; border-top: 0; }
.tip[hidden] { display: none; }
.notes { margin-top: 18px; display: grid; gap: 4px; font-size: var(--t3); color: var(--muted); }
.notes b { font-weight: 600; color: var(--ink); margin-right: 8px; }

/* fixes */
.fixlist { margin-top: 28px; display: grid; gap: 22px; }
.fix { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 12px; }
.fix .id { font-weight: 600; }
.fix .t { font-weight: 600; overflow-wrap: anywhere; }
.fix .cost { grid-column: 2; font-size: var(--t3); color: var(--muted); }
.state { display: inline-block; font-size: var(--t3); font-weight: 400; padding: 0 10px; margin-left: 10px; background: var(--soft); border-radius: 999px; white-space: nowrap; }
.state.done { background: var(--accent); color: var(--accent-ink); }
.fix details { grid-column: 2; font-size: var(--t3); }
.fix summary, .more > summary { cursor: pointer; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
.fix ol { list-style: decimal; padding-left: 20px; margin-top: 6px; }
.empty { margin-top: 24px; color: var(--muted); }
/* the fix section is the one block that asks the reader to act: it takes the phone's dark screen */
.focus { background: var(--panel); color: var(--ink); border-radius: 14px; padding: clamp(28px, 4vw, 48px); margin-left: calc(-1 * clamp(0px, 2vw, 24px)); margin-right: calc(-1 * clamp(0px, 2vw, 24px)); }
.focus .lead { color: var(--muted); }
.also { margin-top: 24px; display: grid; gap: 12px; font-size: var(--t3); color: var(--muted); }
.also b { display: block; font-weight: 600; color: var(--ink); }
.focus .fixlist { gap: 0; margin-top: 20px; }
.focus .fix { padding: 20px 0; border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); grid-template-columns: 44px minmax(0, 1fr); }
.focus .fix .id { color: var(--accent); font-size: 22px; line-height: 1.3; }
.focus .fix .t { font-size: 20px; line-height: 1.35; font-weight: 500; }
.focus .fix .cost, .focus .fix summary, .focus .empty { color: var(--muted); }
.focus .state { display: table; margin: 8px 0 4px; background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
.focus .state.done { background: var(--accent); color: var(--accent-ink); }

/* details */
.more { margin-top: clamp(64px, 8vw, 110px); margin-bottom: 90px; }
.showall { margin-top: 10px; color: var(--muted); font-size: var(--t3); text-decoration: underline; text-underline-offset: 4px; }
.more > summary { font-size: var(--t2); }
.more-in { margin-top: 40px; display: grid; gap: 64px; }
.more h3 { font: 600 var(--t2)/1.3 var(--font); margin: 0 0 12px; }
.more .sub { color: var(--muted); font-size: var(--t3); margin-bottom: 12px; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 5px 0; }
.rows .n { overflow-wrap: anywhere; }
.rows .f { white-space: nowrap; }
.rows .f small { color: var(--muted); margin-left: 8px; }
.rows .gone { text-decoration: line-through; color: var(--muted); }
.rows .sm { grid-column: 1 / -1; font-size: var(--t3); color: var(--muted); }
.pick li { padding: 0; }
.pick button, .pick .cur { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; width: 100%; padding: 8px 0; }
.pick .cur { color: var(--accent); font-weight: 600; }
.pick button:hover { text-decoration: underline; text-underline-offset: 4px; }
.lv { position: relative; }
.lv svg { display: block; width: 100%; height: auto; }
.lv text { font: 400 14px var(--font); fill: var(--muted); }

/* phone */
.phone text { font-family: var(--font); fill: #f1efe9; }
.phone .m { fill: #bdb9b0; }
.phone .ser { font-weight: 500; letter-spacing: -.02em; }
@media (prefers-reduced-motion: no-preference) {
  .read-in > .hero > * { animation: rise .8s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { transform: translateY(14px); } }
}
@media (max-width: 900px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .stage-in { position: static; height: auto; min-height: 0; max-height: none; padding: 28px 16px 32px; }
  .phone { height: auto; min-height: 0; width: min(240px, 70vw); }
  .hero { padding: 40px 0 0; }
}
@media (max-width: 560px) {
  body { font-size: 17px; }
  .day { min-height: 54px; padding: 5px; }
  .day .dv { font-size: 16px; }
  .pick button, .pick .cur { grid-template-columns: auto auto; justify-content: space-between; gap: 0 16px; }
  .pick button > :first-child, .pick .cur > :first-child { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="split">
  <aside class="stage"><div class="stage-in" id="stage"></div></aside>
  <main class="read"><div class="read-in" id="read"></div></main>
</div>
<script>
const D = "__REPORT_DATA__";
const NS = 'http://www.w3.org/2000/svg';
const h = (tag, attrs, ...kids) => {
  const [t, ...cls] = tag.split('.');
  const el = document.createElement(t || 'div');
  if (cls.length) el.className = cls.join(' ');
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'on') for (const [e, f] of Object.entries(v)) el.addEventListener(e, f); else el.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
};
const s = (tag, attrs, parent, txt) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v); if (txt != null) el.textContent = txt; if (parent) parent.append(el); return el; };
const n1 = v => (v == null ? null : (Math.round(v * 10) / 10).toFixed(1));
const longDay = iso => new Date(iso).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const day = iso => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const hm = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const dayTime = iso => new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const maker = d => { const m = d?.manufacturer || ''; return [m.charAt(0).toUpperCase() + m.slice(1), d?.model].filter(Boolean).join(' '); };

const cs = D.checkups, latest = cs[cs.length - 1], first = cs[0];
const names = Object.assign({}, ...cs.map(c => c.findings?.appNames || {}));
const app = pkg => names[pkg] || pkg;
const tidy = t => String(t).replace(/[\w.]+\.[\w.]+/g, m => app(m));
const live = D.changes.filter(c => !c.undoneAt);
const fixKey = c => `${c.action}:${c.target}`;
const doneBy = Object.fromEntries(live.filter(c => c.action !== 'force-stop').map(c => [fixKey(c), c]));   // a closed app can be running again
const changeText = c => c.action === 'note' ? c.target : c.action === 'restrict-background' ? `${app(c.target)} stopped from running in the background`
  : c.action === 'force-stop' ? `${app(c.target)} closed`
  : ({ ble_scan_always_enabled: 'Background Bluetooth scanning turned off', wifi_scan_always_enabled: 'Background Wi-Fi scanning turned off', doze_always_on: 'Always-on display turned off' })[c.target] || `${c.target} set to ${c.value}`;
// markers on the timeline: only changes the phone confirmed and that last (closing an app does not)
const marked = live.filter(c => c.verified && c.action !== 'force-stop');
// a full-charge estimate needs a real discharge; an idle figure needs enough screen-off time to compare
const hpc = c => (c.window?.dischargedPct ?? 0) >= D.limits.minDischargedPct ? c.hoursPerCharge : null;
const rough = c => c.quality?.ok === false || (c.idle?.hours ?? 0) < D.limits.minIdleHours;
let sel = cs.length - 1;
const ok = D.limits.idleOk;

// share of the period spent with the screen on; two checkups far apart on this are not a like-for-like comparison
const onShare = c => c.window?.hoursOnBattery ? c.window.screenOnHours / c.window.hoursOnBattery : null;
const mixDiffers = (a, b) => onShare(a) != null && onShare(b) != null && Math.abs(onShare(a) - onShare(b)) > 0.1;
function verdict() {
  const hl = latest.findings?.headline;
  if (hl) { const m = hl.match(/^.*?[.!?](?=\s|$)/); return m ? m[0] : hl; }
  const st = latest.screenTime, pst = cs.slice(0, -1).reverse().find(c => c.screenTime != null);
  if (st != null) {
    const now = `${n1(st)} h`;
    if (!pst || latest.quality?.ok === false || pst.quality?.ok === false || mixDiffers(latest, pst)) return `A full charge gives about ${now} of screen time.`;
    if (n1(pst.screenTime) === n1(st)) return `A full charge still gives about ${now} of screen time.`;
    return `A full charge now gives about ${now} of screen time, ${st > pst.screenTime ? 'up' : 'down'} from ${n1(pst.screenTime)} h.`;
  }
  const i = latest.idle;
  if (!i) return 'This checkup could not measure idle drain.';
  const prev = cs.slice(0, -1).reverse().find(c => c.idle);
  if (prev && (rough(latest) || rough(prev))) return `Idle drain is ${n1(i.pctPerHour)}% an hour.`;   // no direction claimed from a rough figure
  if (prev && n1(prev.idle.pctPerHour) === n1(i.pctPerHour)) return `Idle drain is steady at ${n1(i.pctPerHour)}% an hour.`;
  if (prev) return `Idle drain is ${i.pctPerHour < prev.idle.pctPerHour ? 'down' : 'up'} to ${n1(i.pctPerHour)}% an hour, from ${n1(prev.idle.pctPerHour)}%.`;
  return `Idle drain is ${n1(i.pctPerHour)}% an hour; healthy is under ${ok}%.`;
}
const clockOf = c => { const st = c.window?.startedAt ? new Date(c.window.startedAt) : null; return t => { if (!st || isNaN(st)) return `${Math.round(t)} h`; const d = new Date(+st + t * 3600e3); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }; };

/* ---------- the phone ---------- */
function phone() {
  const c = cs[sel], b = c.battery || {}, lv = c.levels || [], idle = c.idle;
  const stage = document.getElementById('stage');
  const svg = s('svg', { class: 'phone', viewBox: '-6 0 332 660', role: 'img', 'aria-label': `${maker(latest.device)} showing the checkup of ${dayTime(c.takenAt)}: battery at ${b.levelPct ?? 'unknown'}%, ${c.screenTime != null ? `about ${n1(c.screenTime)} h of screen time from a full charge, ` : ''}idle drain ${idle ? n1(idle.pctPerHour) + '% per hour' : 'not measured'}.` });
  const defs = s('defs', {}, svg);
  const cp = s('clipPath', { id: 'scr' }, defs); s('rect', { x: 10, y: 10, width: 300, height: 640, rx: 38 }, cp);
  s('rect', { x: -3, y: 150, width: 6, height: 56, rx: 3, fill: '#0b0b0a' }, svg);
  s('rect', { x: 317, y: 170, width: 6, height: 70, rx: 3, fill: '#0b0b0a' }, svg);
  s('rect', { x: 0, y: 0, width: 320, height: 660, rx: 48, fill: '#232220' }, svg);
  s('rect', { x: 4, y: 4, width: 312, height: 652, rx: 44, fill: '#0e0e0d' }, svg);
  const g = s('g', { 'clip-path': 'url(#scr)' }, svg);
  s('rect', { x: 10, y: 10, width: 300, height: 640, fill: '#131312' }, g);
  s('text', { x: 34, y: 52, 'font-size': 14, 'font-weight': 600 }, g, hm(c.takenAt));
  s('text', { x: 34, y: 78, 'font-size': 14, class: 'm' }, g, longDay(c.takenAt));
  const lvl = b.levelPct != null ? Math.max(0, Math.min(100, b.levelPct)) : 0;
  s('rect', { x: 262, y: 41, width: 26, height: 13, rx: 3.5, fill: 'none', stroke: '#f1efe9', 'stroke-width': 1.5 }, g);
  s('rect', { x: 289.5, y: 45, width: 2.5, height: 5, rx: 1, fill: '#f1efe9' }, g);
  if (b.levelPct != null) s('rect', { x: 264.5, y: 43.5, width: 21 * lvl / 100, height: 8, rx: 2, fill: '#f1efe9' }, g);
  const st = c.screenTime, w = c.window || {};
  s('text', { x: 34, y: 122, 'font-size': 14, class: 'm' }, g, st != null ? 'Screen time from a full charge' : 'Screen off, drain per hour');
  const big = s('text', { x: 30, y: 206, 'font-size': 92, class: 'ser' }, g, st != null ? n1(st) : idle ? n1(idle.pctPerHour) : '\u2013');
  s('tspan', { dx: 8, 'font-size': 24, class: 'm' }, big, st != null ? 'h' : '%');
  s('text', { x: 34, y: 234, 'font-size': 14, class: 'm' }, g, st != null ? `This period: ${n1(w.screenOnHours)} h of screen, ${w.dischargedPct}% used` : `Healthy is under ${ok}%`);
  if (lv.length > 1) {
    const end = Math.max(lv[lv.length - 1][0], 1), X = t => 30 + t / end * 260, Y = v => 480 - v / 100 * 150;
    s('text', { x: 30, y: 316, 'font-size': 14, class: 'm' }, g, `Battery level, down to ${lv[lv.length - 1][1]}%`);
    const clip = s('clipPath', { id: 'cc' }, defs); s('rect', { x: 30, y: 330, width: 260, height: 150 }, clip);
    const cg = s('g', { 'clip-path': 'url(#cc)' }, g);
    for (const sp of c.screenSpans || []) s('rect', { x: X(sp[0]), y: 330, width: Math.max(1.5, X(sp[1]) - X(sp[0])), height: 150, fill: 'rgba(255,255,255,.12)' }, cg);
    s('polyline', { points: lv.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' '), fill: 'none', stroke: '#b9e3a6', 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, cg);
    const clock = clockOf(c);
    s('text', { x: 30, y: 500, 'font-size': 13, class: 'm' }, g, clock(0));
    s('text', { x: 290, y: 500, 'font-size': 13, class: 'm', 'text-anchor': 'end' }, g, clock(end));
  }
  if (st != null && idle) {
    s('text', { x: 30, y: 552, 'font-size': 14, class: 'm' }, g, 'Screen off, drain per hour');
    s('text', { x: 290, y: 552, 'font-size': 22, 'text-anchor': 'end', class: 'ser' }, g, `${n1(idle.pctPerHour)}%`);
  }
  s('text', { x: 30, y: 588, 'font-size': 14, class: 'm' }, g, 'A full charge lasts about');
  s('text', { x: 290, y: 588, 'font-size': 22, 'text-anchor': 'end', class: 'ser' }, g, hpc(c) != null ? `${n1(hpc(c))} h` : '–');
  s('rect', { x: 125, y: 638, width: 70, height: 4, rx: 2, fill: 'rgba(255,255,255,.4)' }, g);
  s('circle', { cx: 160, cy: 30, r: 7, fill: '#000' }, svg);
  stage.replaceChildren(svg, h('p.phone-name', {}, [maker(latest.device), latest.device?.android ? `Android ${latest.device.android}` : ''].filter(Boolean).join(', ')));
}

/* ---------- timeline ---------- */
function tooltip(host) {
  const tip = h('div.tip', { hidden: true }); host.append(tip);
  // content: { title, sub, rows: [[label, value]], notes: [text] }
  return { show(x, y, { title, sub, rows = [], notes = [] }) {
    tip.replaceChildren(...[h('div.tt', {}, title, sub ? h('span', {}, sub) : null),
      rows.length ? h('dl', {}, rows.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])) : null, ...notes.map(t => h('div.tn', {}, t))].filter(Boolean));
    tip.hidden = false; const w = host.clientWidth, half = tip.offsetWidth / 2; tip.style.left = Math.max(half, Math.min(w - half, x)) + 'px'; tip.style.top = (y - 10) + 'px'; }, hide() { tip.hidden = true; } };
}
let allMonths = false;
// a curve of one figure at every checkup; `band` draws the healthy zone below a limit
function trendCurve(host, pts, { title, get, unit, band, aria }, tip, box) {
  const W = host.clientWidth || 600, H = W < 520 ? 190 : 210, m = { l: 12, r: 12, t: 62, b: 34 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const ts = pts.map(p => +new Date(p.c.takenAt)), t0 = ts[0], t1 = ts[ts.length - 1], padT = (t1 - t0) * 0.06 || 1;
  const x = t => m.l + (t - (t0 - padT)) / (t1 - t0 + 2 * padT) * pw;
  const vs = pts.map(p => get(p.c)), top = Math.max(...vs, band ?? 0) * 1.15, y = v => m.t + ph - v / top * ph;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${aria}: ${pts.map((p, k) => `${day(p.c.takenAt)} ${n1(vs[k])}${unit}`).join(', ')}.` }, host);
  s('text', { x: m.l, y: 16, class: 'h' }, svg, title);

/* ---------- fixes ---------- */
function fixItem(x, n, steps) {
  // a setting the latest checkup still reports as on, after it was turned off, was changed back on the phone
  const by = doneBy[x.id], done = by && !(x.action === 'setting' && latest.takenAt > by.at) ? by : null;
  return h('li.fix', {}, h('span.id', {}, `F${n}`),
    h('span.t', {}, x.title, h('span.state' + (done ? '.done' : ''), {}, done ? `Done ${day(done.at)}` : x.kind === 'auto' ? 'Assistant can apply' : 'Apply it yourself')),
    x.tradeoff ? h('span.cost', {}, `Costs: ${x.tradeoff}`) : null,
    steps?.length ? h('details', {}, h('summary', {}, 'Show the steps'), h('ol', {}, steps.map(t => h('li', {}, t)))) : null);
}
function fixes() {
  const f = latest.findings || {}, rank = { high: 0, medium: 1, info: 2 };
  const flags = latest.flags.slice().sort((a, b) => rank[a.severity] - rank[b.severity]);
  const top = flags.find(x => x.severity !== 'info') || flags[0];
  const items = [], seen = new Set(); let n = 0;
  for (const fl of latest.flags) for (const x of fl.fixes) {
    if (seen.has(x.id)) continue; seen.add(x.id);

  }
  const also = flags.filter(x => x !== top && !x.fixes.length);
  const alsoList = also.length ? h('ul.also', { 'aria-label': 'Also noticed' }, also.map(x => h('li', {}, h('b', {}, tidy(x.title)), tidy(f.explanations?.[x.id] || x.detail)))) : null;
  const worn = also.some(x => x.severity === 'high');
  for (const x of f.manual || []) items.push(fixItem({ id: 'manual:' + x.title, kind: 'manual', title: x.title, tradeoff: x.tradeoff }, ++n, x.steps));
  return [
    top ? h('p.lead', {}, tidy(f.explanations?.[top.id] || top.detail)) : null,
    worn ? alsoList : null,
    items.length ? h('ul.fixlist', {}, items) : h('p.empty', {}, latest.quality?.ok === false ? 'Too little data in this checkup to suggest fixes.' : 'Nothing to fix from this checkup.'),
    worn ? null : alsoList,

}

/* ---------- details ---------- */
function rows(list, none) {
  if (!list.length) return h('p.sub', {}, none);
  return h('ul.rows', {}, list.map(r => h('li', {}, h('span.n', { title: r.title }, r.label), h('span.f', {}, r.figure, r.note ? h('small', {}, r.note) : null))));
}
function curve(host, c) {

  if (lv.length < 2) { host.append(h('p.sub', {}, 'This checkup has no battery level history.')); return; }
  const W = host.clientWidth || 560, H = W < 520 ? 220 : 260, m = { l: 40, r: 8, t: 10, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const end = Math.max(lv[lv.length - 1][0], 1), x = t => m.l + t / end * pw, y = v => m.t + ph - v / 100 * ph;
  const clock = clockOf(c), tip = tooltip(host);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Battery level from ${lv[0][1]}% to ${lv[lv.length - 1][1]}% over ${n1(end)} hours.` }, host);
  for (const v of [0, 50, 100]) s('text', { x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end' }, svg, `${v}%`);

}
let lvHost = null, showAll = false;
function detailBody() {
  const c = cs[sel], w = c.window || {}, off = w.screenOffHours || 0, b = c.battery || {}, d = c.device || {};

    ...(c.btScans || []).map(x => ({ label: app(x.app), title: x.app, v: x.hours, figure: `${n1(x.hours)} h`, note: 'scanning Bluetooth' })),
  ].sort((a, b) => b.v - a.v).slice(0, 6);

  const body = h('div.more-in', {},
    sec(`All checkups (${cs.length})`, h('ul.rows.pick', {}, cs.map((x, i) => [x, i]).reverse().filter(([, i], k) => showAll || k < 5 || i === sel).map(([x, i]) => h('li', {}, h(i === sel ? 'div.cur' : 'button', i === sel ? { 'aria-current': 'true' } : { type: 'button', on: { click: () => { sel = i; phone(); renderDetails(true); if (window.__tl.isConnected) timeline(window.__tl); } } },
      h('span', {}, dayTime(x.takenAt)), h('span', {}, `${cell(n1(x.screenTime), ' h')} screen time`), h('span', {}, `${cell(n1(x.idle?.pctPerHour), '%')} idle`))))),
      cs.length > 5 ? h('button.showall', { type: 'button', on: { click: () => { showAll = !showAll; renderDetails(true); } } }, showAll ? 'Show the latest 5' : `Show all ${cs.length} checkups`) : null),
    sec(`Checkup on ${dayTime(c.takenAt)}`, h('p.sub', {}, w.hoursOnBattery != null ? `${n1(w.hoursOnBattery)} h on battery, ${w.dischargedPct ?? 0}% used. Shaded: screen on.${b.levelPct != null && c.levels?.length && b.levelPct > c.levels[c.levels.length - 1][1] + 3 ? ` The curve stops where the phone was put on charge; it was at ${b.levelPct}% at the checkup.` : ''}` : ''), lvHost),

    sec('Changes made', D.changes.length ? h('ul.rows', {}, [...D.changes].reverse().map(x => h('li', {}, h('span.n' + (x.undoneAt ? '.gone' : ''), {}, changeText(x)), h('span.f', {}, day(x.at)),
      x.undoneAt ? h('span.sm', {}, `Undone ${day(x.undoneAt)}`) : !x.verified ? h('span.sm', {}, 'The phone did not confirm this change.') : null))) : h('p.sub', {}, 'No changes have been made to this phone.')),
    sec('The battery itself', h('ul.rows', {}, [

      ['Capacity now', b.measuredFullMah ? `${b.measuredFullMah.toLocaleString('en')} mAh` : null], ['Temperature', b.temperatureC != null ? `${n1(b.temperatureC)} °C` : null],

function renderDetails(keepOpen) {

function readColumn() {

    more].filter(Boolean));

readColumn(); phone();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (window.__tl.isConnected) timeline(window.__tl); if (lvHost && document.getElementById('more').open) curve(lvHost, cs[sel]); }, 150); });
