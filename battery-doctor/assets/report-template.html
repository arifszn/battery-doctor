<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Battery report</title>
<style>
/* the phone sits in a tinted frame, the report on a sheet inset beside it; light and dark */
:root {
  --frame: #edf1ef; --stage: transparent; --stage-muted: #56605b; --sheet: #ffffff; --edge: #e3e8e6;
  --split-pad: 8px; --split-gap: 0px; --sheet-r: 16px;
  --ink: #131416; --ink-2: #2d3032; --muted: #5d5f60; --line: #eef0f1; --soft: #f4f6f8;
  --data: #237850; --data-ink: #ffffff; --accent: #237850; --band: #e7f2ed; --warn: #c4242a; --focus: #237850;
  --panel: #ddede6; --panel-ink: #112e20; --panel-muted: #415e50; --panel-rule: #c5dcd1; --panel-edge: #ddede6; --panel-id: #237850;
  --chip: #c8e0d5; --chip-ink: #1a412f; --done: #237850; --done-ink: #ffffff;
  --card: #ffffff; --card-edge: #e6eaeb; --day: #e8edeb; --day-empty: #f5f7f6; --r: 12px; --day-r: 8px;
  --tip: #131416; --tip-ink: #ffffff;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t1: clamp(28px, 1.2rem + 1.4vw, 42px); --h2: 20px; --t2: 16px; --t3: 14px; --pad: clamp(24px, 4.5vw, 72px);
  --ph-key: #1e2421; --ph-body: #272f2b; --ph-bezel: #0c0f0e; --ph-screen: #15211b; --ph-ink: #eef3f1; --ph-muted: #a0b2aa;
  --ph-line: #83d2ad; --ph-span: rgba(131,210,173,.14); --ph-bar: rgba(255,255,255,.4); --ph-cam: #000;
}
@media (prefers-color-scheme: dark) {
  :root {
    --frame: #0a0e0f; --stage-muted: #9aa5a3; --sheet: #111618; --edge: #1f2629;
    --ink: #eef2f1; --ink-2: #c9d1cf; --muted: #9aa5a3; --line: #1f2629; --soft: #182022;
    --data: #68cd9e; --data-ink: #081911; --accent: #68cd9e; --band: #153727; --warn: #ff7a7f; --focus: #68cd9e;
    --panel: #28322d; --panel-ink: #f4f7f7; --panel-muted: #b5c0bb; --panel-rule: #37433d; --panel-edge: #28322d; --panel-id: #86d9b2;
    --chip: #37443e; --chip-ink: #e9efec; --done: #68cd9e; --done-ink: #081911;
    --card: #161d20; --card-edge: #222b2e; --day: #1c2629; --day-empty: #141b1d;
    --tip: #eef2f1; --tip-ink: #111618;
    --ph-body: #2c3a33; --ph-key: #232f29; --ph-screen: #0b130f;
  }
}
.read { border: 1px solid var(--edge); }
.focus { border: 1px solid var(--panel-edge); }
.tr { border: 1px solid var(--card-edge); }
.fix .id { color: var(--panel-id); }
.focus summary:hover { color: var(--panel-ink); }
.focus :focus-visible { outline-color: var(--panel-ink); }

/* the plan: what the next checkup tests and what is still open, one line per item with a tag */
.plan { margin-top: 16px; background: var(--card); border: 1px solid var(--card-edge); border-radius: var(--r); padding: 8px 22px; }
.pl > li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 6px 16px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.55; }
.pl > li:first-child { border-top: 0; }
.pl .tag { justify-self: start; align-self: start; font: 600 12px/1 var(--font); padding: 6px 9px; border-radius: 999px; background: var(--soft); color: var(--ink-2); margin-top: 1px; white-space: nowrap; }
.pl .tag.now { background: var(--data); color: var(--data-ink); }
.pl .tag.due { background: var(--band); color: var(--ink); }
.pl b { font-weight: 600; }
.pl .muted { color: var(--muted); }
.plan .why { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.plan-at { margin-top: 4px; font-size: var(--t3); color: var(--muted); }
@media (max-width: 560px) { .plan { padding: 6px 16px; } .pl > li { grid-template-columns: minmax(0, 1fr); } }

/* details as cards: two wide cards, then pairs */
.more-in { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.more-in > section { background: var(--card); border: 1px solid var(--card-edge); border-radius: var(--r); padding: 20px 20px 12px; min-width: 0; }
.more-in > section:nth-child(-n+2), .more-in > section:last-child:nth-child(odd) { grid-column: 1 / -1; }
.more-in > section > h3 { margin-bottom: 10px; }
.more-in .rows li:first-child { border-top: 0; }
.more-in .rows li { font-size: 15px; }
@media (max-width: 700px) {
  .more-in { grid-template-columns: minmax(0, 1fr); }
}

/* shared structure; every value comes from the variant's tokens */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--frame); }
body { margin: 0; background: var(--frame); color: var(--ink); font: 400 var(--t2)/1.55 var(--font); font-variant-numeric: tabular-nums; overflow-x: hidden; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus, var(--ink)); outline-offset: 3px; border-radius: 4px; }
small, .small { font-size: var(--t3); }
.muted { color: var(--muted); }

/* the split */
.split { display: grid; grid-template-columns: minmax(340px, 5fr) minmax(0, 7fr); min-height: 100svh; gap: var(--split-gap, 0); padding: var(--split-pad, 0); }
.stage { background: var(--stage); min-width: 0; border-radius: var(--stage-r, 0); }
.stage-in { position: sticky; top: var(--split-pad, 0px); height: calc(100svh - 2 * var(--split-pad, 0px)); min-height: 560px; max-height: 980px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px 24px; }
.phone { height: min(calc(100svh - 150px), 720px); min-height: 460px; width: auto; max-width: 100%; display: block; overflow: visible; }
.phone-name { font-size: var(--t3); color: var(--stage-muted, var(--muted)); text-align: center; }
.read { background: var(--sheet); min-width: 0; padding: 0 var(--pad); border-radius: var(--sheet-r, 0); box-shadow: var(--sheet-edge, none); }
.read-in { max-width: 760px; margin: 0 auto 0 0; }

/* the answer */
.hero { padding: clamp(48px, 9svh, 96px) 0 0; }
h1 { font-weight: var(--h1-w, 600); font-size: var(--t1); line-height: 1.08; letter-spacing: var(--h1-track, -.025em); max-width: none; text-wrap: pretty; }
.line { margin-top: 20px; color: var(--ink-2, var(--muted)); max-width: 36em; }
.notice { margin-top: 16px; max-width: 62ch; padding: 12px 16px; border-radius: 10px; background: var(--soft); color: var(--ink-2); font-size: var(--t3); line-height: 1.55; }
.sec { margin-top: clamp(56px, 7vw, 88px); }
h2 { font-weight: 600; font-size: var(--h2); line-height: 1.25; letter-spacing: -.01em; }
.lead { margin-top: 12px; color: var(--ink-2, var(--ink)); }

/* fixes */
.focus { background: var(--panel); color: var(--panel-ink, var(--ink)); border-radius: var(--r); padding: clamp(24px, 3.4vw, 40px); }
.focus .lead { color: var(--panel-muted, var(--muted)); }
.fixlist { margin-top: 20px; display: grid; }
.fix { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; padding: 18px 0; border-top: 1px solid var(--panel-rule, var(--line)); }
.fix .id { font: 600 var(--t3)/1.9 var(--font-num, var(--font)); color: var(--panel-muted, var(--muted)); }
.fix .t { font-weight: 500; font-size: calc(var(--t2) + 2px); line-height: 1.4; overflow-wrap: anywhere; }
.fix .cost { grid-column: 2; font-size: var(--t3); color: var(--panel-muted, var(--muted)); }
.state { display: table; margin: 8px 0 2px; font-size: 13px; font-weight: 500; line-height: 24px; padding: 0 10px; border-radius: var(--pill-r, 999px); background: var(--chip); color: var(--chip-ink, inherit); white-space: nowrap; }
.state.done { background: var(--done); color: var(--done-ink); }
.fix details { grid-column: 2; font-size: var(--t3); }
.fix .row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.fix .row .state { margin: 0; }
.copy { width: 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--panel-muted, var(--muted)); transition: background-color .12s ease, color .12s ease; }
.copy:hover { background: var(--chip); color: var(--panel-ink, var(--ink)); }
.copy svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.copied { font-size: 12px; color: var(--panel-muted, var(--muted)); opacity: .75; }
.fix summary, .more > summary { cursor: pointer; color: var(--panel-muted, var(--muted)); text-decoration: underline; text-underline-offset: 4px; }
.fix summary:hover { color: var(--panel-ink, var(--ink)); }
.fix ol { list-style: decimal; padding-left: 20px; margin-top: 8px; display: grid; gap: 4px; }
.empty { margin-top: 20px; color: var(--muted); }
.also { margin-top: 24px; display: grid; gap: 12px; font-size: var(--t3); color: var(--panel-muted, var(--muted)); }
.also b { display: block; font-weight: 600; color: var(--panel-ink, var(--ink)); }

/* trend curves and calendar */
.tl { margin-top: 24px; position: relative; }
.tr { margin-bottom: 28px; padding: 20px 20px 8px; background: var(--card); border-radius: var(--r); box-shadow: var(--card-edge, none); }
.tr svg { display: block; width: 100%; height: auto; overflow: visible; }
.tr text { font-family: var(--font); fill: var(--muted); font-size: 13px; }
.tr text.v { fill: var(--ink); font: 600 15px var(--font-num, var(--font)); }
.tr text.z { fill: var(--muted); }
.tr text.h { fill: var(--ink); font-weight: 600; font-size: 14px; }
.tr polyline { stroke: var(--data) !important; stroke-width: 2.5px !important; }
.tr circle[fill="var(--accent)"] { fill: var(--data); }
.tr circle[stroke="var(--accent)"] { stroke: var(--data); }
.tr line[stroke="var(--accent)"] { stroke: var(--data); stroke-dasharray: 4 4; }
.tr rect[fill="var(--soft)"] { fill: var(--band); }
.cal + .cal { margin-top: 28px; }
.cal-m { font-weight: 600; margin-bottom: 10px; }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-g .wd { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.day { position: relative; width: 100%; min-height: 76px; padding: 6px 8px; border-radius: var(--day-r, 6px); display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; line-height: 1.2; color: var(--muted); background: var(--day-empty); transition: transform .12s ease; }
.day.has { background: var(--day); color: var(--ink); }
.day.has:hover { transform: translateY(-1px); }
.day.ok { background: var(--data); color: var(--data-ink); }
.day.rough { background: transparent; outline: 1.5px dashed var(--muted); outline-offset: -2px; color: var(--ink); }
.day.cur { outline: 2px solid var(--ink); outline-offset: 2px; }
.day .dv { font: 600 19px/1.1 var(--font-num, var(--font)); }
.day .dv small { font-size: 12px; font-weight: 400; }
.day .di { font-size: 12px; }
.day .dm { position: absolute; top: 5px; right: 5px; font-size: 11px; font-weight: 600; line-height: 16px; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--sheet); }
.day.ok .dm { background: var(--data-ink); color: var(--data); }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--tip, var(--ink)); color: var(--tip-ink, var(--sheet)); font-size: 13px; line-height: 1.35; padding: 10px 12px; border-radius: 8px; width: max-content; max-width: min(320px, 90vw); transform: translate(-50%, -100%); box-shadow: 0 6px 20px -8px rgba(0,0,0,.4); }
.tip .tt { font-weight: 600; font-size: 14px; }
.tip .tt span { font-weight: 400; opacity: .7; margin-left: 8px; }
.tip dl { margin-top: 6px; display: grid; grid-template-columns: auto auto; gap: 3px 20px; }
.tip dt { opacity: .7; white-space: nowrap; }
.tip dd { text-align: right; white-space: nowrap; font-weight: 600; }
.tip .tn { margin-top: 6px; padding-top: 6px; border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent); font-size: 12px; opacity: .85; }
.tip .tn + .tn { margin-top: 2px; padding-top: 0; border-top: 0; }
.tip[hidden] { display: none; }
.notes { margin-top: 16px; display: grid; gap: 4px; font-size: var(--t3); color: var(--muted); }
.notes b { font-weight: 600; color: var(--ink); margin-right: 8px; }

/* details */
.more { margin-top: clamp(56px, 7vw, 88px); margin-bottom: 80px; }
.more > summary { font-size: var(--h2); font-weight: 600; color: var(--ink); text-decoration: none; list-style: none; display: flex; align-items: center; gap: 10px; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s ease; }
.more[open] > summary::after { transform: rotate(225deg) translate(-2px, -2px); }
.showall { margin-top: 10px; color: var(--muted); font-size: var(--t3); text-decoration: underline; text-underline-offset: 4px; }
.showall:hover { color: var(--ink); }
.more-in { margin-top: 24px; display: grid; gap: 40px; }
.more h3 { font: 600 var(--t2)/1.3 var(--font); margin: 0 0 8px; }
.more .sub { color: var(--muted); font-size: var(--t3); margin-bottom: 10px; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 9px 0; border-top: 1px solid var(--line); }
.rows .n { overflow-wrap: break-word; min-width: 0; }
.rows .f { white-space: nowrap; text-align: right; font-family: var(--font-num, var(--font)); }
.rows .f small { color: var(--muted); margin-left: 8px; font-family: var(--font); }
.rows .gone { text-decoration: line-through; color: var(--muted); }
.rows .sm { grid-column: 1 / -1; font-size: var(--t3); color: var(--muted); }
.pick li { padding: 0; border-top: 0; display: block; }
.pick li + li:not(.head) { margin-top: 2px; }
.pick .head, .pick button, .pick .cur { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 6.5rem); gap: 12px; width: 100%; padding: 8px 12px; text-align: left; font-size: var(--t3); }
.pick .head { align-items: end; padding-top: 0; padding-bottom: 6px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.pick .head > :not(:first-child), .pick button > :not(:first-child), .pick .cur > :not(:first-child) { text-align: right; }
.pick button, .pick .cur { border-radius: 8px; }
.pick .cur { background: var(--band); color: var(--ink); font-weight: 500; }
.pick button { color: var(--ink-2); }
.pick button:hover { background: var(--soft); color: var(--ink); }
.lv { position: relative; }
.lv svg { display: block; width: 100%; height: auto; }
.lv text { font: 400 12px var(--font); fill: var(--muted); }
.lv polyline { stroke: var(--data); }
.lv circle { fill: var(--data); }

/* the phone */
.phone text { font-family: var(--font); fill: var(--ph-ink); }
.phone .m { fill: var(--ph-muted); }
.phone .ser { font-family: var(--font-num, var(--font)); font-weight: var(--ph-big-w, 500); letter-spacing: -.03em; }

@media (prefers-reduced-motion: no-preference) {
  .read-in > .hero > * { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .read-in > .hero > :nth-child(2) { animation-delay: .07s; }
  .stage .phone { animation: fade .8s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
}
@media (max-width: 900px) {
  .split { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; }
  .stage { border-radius: 0; }
  .stage-in { position: static; height: auto; min-height: 0; max-height: none; padding: 28px 16px 32px; }
  .phone { height: auto; min-height: 0; width: min(240px, 66vw); }
  .read { border-radius: 0; padding: 0 16px; }
  .hero { padding: 36px 0 0; }
}
@media (max-width: 560px) {
  h1 { font-size: 22px; line-height: 1.2; }
  .day { min-height: 54px; padding: 4px 5px; }
  .day .dv { font-size: 15px; }
  .pick .head, .pick button, .pick .cur { grid-template-columns: minmax(0, 1fr) repeat(3, 3.6rem); gap: 6px; padding-left: 8px; padding-right: 8px; }
}

</style>
</head>
<body>
<div class="split">
  <aside class="stage"><div class="stage-in" id="stage"></div></aside>
  <main class="read"><div class="read-in" id="read"></div></main>
</div>
<script>
const D = "__REPORT_DATA__";
const NS = 'http://www.w3.org/2000/svg';
const h = (tag, attrs, ...kids) => {
  const [t, ...cls] = tag.split('.');
  const el = document.createElement(t || 'div');
  if (cls.length) el.className = cls.join(' ');
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'on') for (const [e, f] of Object.entries(v)) el.addEventListener(e, f); else el.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
};
const s = (tag, attrs, parent, txt) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v); if (txt != null) el.textContent = txt; if (parent) parent.append(el); return el; };
const n1 = v => (v == null ? null : (Math.round(v * 10) / 10).toFixed(1));
const longDay = iso => new Date(iso).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const day = iso => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const hm = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const dayTime = iso => new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const maker = d => { const m = d?.manufacturer || ''; return [m.charAt(0).toUpperCase() + m.slice(1), d?.model].filter(Boolean).join(' '); };

const cs = D.checkups, latest = cs[cs.length - 1], first = cs[0];
const names = Object.assign({}, ...cs.map(c => c.findings?.appNames || {}));
const app = pkg => names[pkg] || pkg;
const tidy = t => String(t).replace(/[\w.]+\.[\w.]+/g, m => app(m));
const live = D.changes.filter(c => !c.undoneAt);
const fixKey = c => `${c.action}:${c.target}`;
const doneBy = Object.fromEntries(live.filter(c => c.action !== 'force-stop').map(c => [fixKey(c), c]));   // a closed app can be running again
const changeText = c => c.action === 'note' ? c.target : c.action === 'phone' ? tidy(c.target) : c.action === 'restrict-background' ? `${app(c.target)} stopped from running in the background`
  : c.action === 'force-stop' ? `${app(c.target)} closed`
  : ({ ble_scan_always_enabled: 'Background Bluetooth scanning turned off', wifi_scan_always_enabled: 'Background Wi-Fi scanning turned off', doze_always_on: 'Always-on display turned off' })[c.target] || `${c.target} set to ${c.value}`;
// markers on the timeline: only changes the phone confirmed and that last (closing an app does not)
const marked = live.filter(c => c.verified && c.action !== 'force-stop');
// a full-charge estimate needs a real discharge; an idle figure needs enough screen-off time to compare
const hpc = c => (c.window?.dischargedPct ?? 0) >= D.limits.minDischargedPct ? c.hoursPerCharge : null;
const rough = c => c.quality?.ok === false || (c.idle?.hours ?? 0) < D.limits.minIdleHours;
let sel = cs.length - 1;
const ok = D.limits.idleOk;

// share of the period spent with the screen on; two checkups far apart on this are not a like-for-like comparison
const onShare = c => c.window?.hoursOnBattery ? c.window.screenOnHours / c.window.hoursOnBattery : null;
const mixDiffers = (a, b) => onShare(a) != null && onShare(b) != null && Math.abs(onShare(a) - onShare(b)) > 0.1;
function verdict() {
  const hl = latest.findings?.headline;
  if (hl) { const m = hl.match(/^.*?[.!?](?=\s|$)/); return m ? m[0] : hl; }
  const st = latest.screenTime, pst = cs.slice(0, -1).reverse().find(c => c.screenTime != null);
  if (st != null) {
    const now = `${n1(st)} h`;
    if (!pst || latest.quality?.ok === false || pst.quality?.ok === false || mixDiffers(latest, pst)) return `A full charge gives about ${now} of screen time.`;
    if (n1(pst.screenTime) === n1(st)) return `A full charge still gives about ${now} of screen time.`;
    return `A full charge now gives about ${now} of screen time, ${st > pst.screenTime ? 'up' : 'down'} from ${n1(pst.screenTime)} h.`;
  }
  const i = latest.idle;
  if (!i) return latest.quality?.ok === false ? 'Not enough data yet.' : 'This checkup could not measure idle drain.';
  const prev = cs.slice(0, -1).reverse().find(c => c.idle);
